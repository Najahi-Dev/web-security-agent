# Gitleaks Configuration & Secret Detection Allowlist

[allowlist]
description = "Ignore known documentation dummy keys, sample placeholders, and template files"
regexes = [
  '''(?i)AKIAIOSFODNN7EXAMPLE''',
  '''(?i)your_gemini_api_key_here''',
  '''(?i)your_anthropic_api_key_here''',
  '''(?i)sk-ant-your_anthropic_api_key_here'''
]
paths = [
  '''^\.env\.example$''',
  '''^README\.md$'''
]
